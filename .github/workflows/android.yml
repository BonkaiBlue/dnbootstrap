name: Android CI

on:
  push:
    branches:
      - fix/1.21.6-angle
      - test/es31-context
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Test 6 GLFW patch (request OpenGL ES 3.1)
        run: git -C app/src/main/cpp/glfw34 apply "$GITHUB_WORKSPACE/patches/glfw-es31-context.patch"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnbootstrap-es31test
          path: app/build/outputs/apk/debug/*.apk
